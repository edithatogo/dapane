# Runtime dependencies are checked separately from Dapane's unresolved licence.
# cargo-deny 0.20.2; see docs/release-controls.md.
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]
confidence-threshold = 0.95

[licenses.private]
# Applies only to unpublished workspace crates, not their third-party dependencies.
# This does not grant Dapane a licence or permit registry publication.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
