[workspace]
members = ["crates/dapane-core", "crates/dapane-cli", "crates/dapane-python"]
default-members = ["crates/dapane-core", "crates/dapane-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/edithatogo/dapane"
publish = false

[workspace.dependencies]
dapane-core = { path = "crates/dapane-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.11.1"
pyo3 = "0.30.1"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
