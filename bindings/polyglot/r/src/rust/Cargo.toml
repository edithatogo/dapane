[package]
name = "dapane-r"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"
description = "Direct R transport for the Dapane Rust kernel"

[lib]
name = "dapane_r"
crate-type = ["staticlib", "rlib"]

[workspace]
resolver = "3"

[dependencies]
dapane-core = { path = "../../../../../crates/dapane-core", version = "0.1.0" }
extendr-api = { version = "=0.9.0", default-features = false }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
