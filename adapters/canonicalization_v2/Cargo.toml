[package]
name = "dapane-canonical-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Optional JCS report fingerprints for Dapane"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
dapane-core = { path = "../../crates/dapane-core", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
