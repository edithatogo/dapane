[package]
name = "dapane-kairos-usage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
description = "Optional staged-resource costing projection from Kairos committed usage"
repository = "https://github.com/edithatogo/dapane"

[dependencies]
dapane-core = { path = "../../crates/dapane-core", version = "=0.1.0" }
kairo-ecs-des = { version = "=0.1.0", git = "https://github.com/edithatogo/kairos", rev = "cdda89112575a42aa8c8e67868f61379ea35d05d" }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
kairo-ecs-types = { version = "=0.0.0", git = "https://github.com/edithatogo/kairos", rev = "cdda89112575a42aa8c8e67868f61379ea35d05d" }

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
