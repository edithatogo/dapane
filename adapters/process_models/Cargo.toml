[package]
name = "dapane-process-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false
description = "Bounded X2 PNML/Petri-net and named BPMN 2.0 subset adapters for Dapane"
repository = "https://github.com/edithatogo/dapane"

# Kept outside the integrator-owned root Cargo workspace until explicit adoption.
[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
