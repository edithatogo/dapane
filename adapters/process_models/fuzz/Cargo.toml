[package]
name = "dapane-boundary-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
libfuzzer-sys = "=0.4.13"
dapane-process-models = { path = ".." }

[[bin]]
name = "parse_models"
path = "fuzz_targets/parse_models.rs"
test = false
doc = false
bench = false

[profile.release]
opt-level = 1
codegen-units = 16
