name: Dapane project Python
description: Select the repository interpreter and activate a verified local environment
inputs:
  cache:
    description: Optional dependency cache used by setup-python
    required: false
    default: ''
  cache-dependency-path:
    description: Lock or requirements file for the dependency cache
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: ${{ github.action_path }}/../../../.python-version
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Create and verify project environment
      shell: bash
      run: |
        set -euo pipefail
        project="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        python -m venv "$project/.venv"
        "$project/.venv/bin/python" - "$project/.python-version" <<'PY'
        import platform
        import sys
        from pathlib import Path

        expected = Path(sys.argv[1]).read_text().strip()
        if platform.python_implementation() != "CPython" or platform.python_version() != expected:
            raise SystemExit(f"Expected CPython {expected}, got {sys.version}")
        print(sys.executable, sys.version)
        PY
        echo "$project/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$project/.venv" >> "$GITHUB_ENV"
