name: Installed provider consumers

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      use_release_candidate:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: provider-consumers-${{ github.ref }}-${{ inputs.use_release_candidate && 'release' || 'standalone' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_provider_consumers: ${{ steps.select.outputs.run_provider_consumers }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Select provider-consumer scope
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            python3 scripts/ci_select.py --mode pr \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ env.ACT }}" = "true" ]; then
            python3 scripts/ci_select.py --mode pr --base "HEAD~1" --head "HEAD" --github-output "$GITHUB_OUTPUT"
          else
            echo "run_provider_consumers=true" >> "$GITHUB_OUTPUT"
          fi

  installed-providers:
    needs: changes
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.run_provider_consumers == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Download the release candidate
        if: inputs.use_release_candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-python-3.15.1
          path: ${{ runner.temp }}/dapane-release-candidate
      - name: Verify and install the release candidate before provider checkouts
        if: inputs.use_release_candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/dapane-release-candidate"
          python3 scripts/release_assurance.py verify \
            --evidence "$candidate/evidence.json" --artifact-dir "$candidate"
          mkdir -p "$GITHUB_WORKSPACE/target/release" "$RUNNER_TEMP/dapane-wheels"
          install -m 755 "$candidate/dapane" "$GITHUB_WORKSPACE/target/release/dapane"
          cp "$candidate/"*.whl "$RUNNER_TEMP/dapane-wheels/"
      - name: Read immutable provider revisions
        id: pins
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pins = json.loads(Path("docs/provider-consumers.lock.json").read_text())
          assert pins["schema_version"] == "1"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in ("workforce", "genomics"):
                  commit = pins[name]["commit"]
                  assert re.fullmatch("[0-9a-f]{40}", commit), commit
                  output.write(f"{name}_ref={commit}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/microcosting_healthworkforce
          ref: ${{ steps.pins.outputs.workforce_ref }}
          path: providers/workforce
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edithatogo/microcosting_genomics
          ref: ${{ steps.pins.outputs.genomics_ref }}
          path: providers/genomics
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.13.8'
          enable-cache: true
      - name: Cache Cargo registry and standalone build target
        if: ${{ !inputs.use_release_candidate }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-providers-1.99.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-providers-1.99.1-
      - name: Prepare pinned Python environments and verifier tooling
        run: |
          PROFILE="$RUNNER_TEMP/provider-consumers-profile.jsonl"
          uv python install 3.15.1 3.15.2
          uv venv --python 3.15.1 "$RUNNER_TEMP/dapane-build"
          python3 scripts/ci_profile.py run --name uv-dev-deps --profile-file "$PROFILE" -- uv pip install --python "$RUNNER_TEMP/dapane-build/bin/python" -r requirements-dev.txt
          "$RUNNER_TEMP/dapane-build/bin/ruff" check scripts/verify_provider_consumers.py
          "$RUNNER_TEMP/dapane-build/bin/ruff" format --check --diff scripts/verify_provider_consumers.py
      - name: Build the shared native interfaces for standalone qualification
        if: ${{ !inputs.use_release_candidate }}
        run: |
          PROFILE="$RUNNER_TEMP/provider-consumers-profile.jsonl"
          rustup toolchain install 1.99.1 --profile minimal
          python3 scripts/ci_profile.py run --name cargo-build-cli --profile-file "$PROFILE" -- cargo build --locked --release -p dapane-cli
          python3 scripts/ci_profile.py run --name maturin-wheel --profile-file "$PROFILE" -- "$RUNNER_TEMP/dapane-build/bin/maturin" build --locked --release --interpreter "$RUNNER_TEMP/dapane-build/bin/python" --out "$RUNNER_TEMP/dapane-wheels"
      - name: Install the shared native wheel for boundary tests
        run: |
          uv pip install --python "$RUNNER_TEMP/dapane-build/bin/python" --no-deps "$RUNNER_TEMP"/dapane-wheels/*.whl
      - name: Install the locked workforce provider wheel
        working-directory: providers/workforce
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/workforce-installed
        run: |
          uv sync --locked --no-install-project --python 3.15.2
          uv build --wheel --python "$UV_PROJECT_ENVIRONMENT/bin/python" --out-dir "$RUNNER_TEMP/workforce-wheels"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps "$RUNNER_TEMP"/workforce-wheels/*.whl "$RUNNER_TEMP"/dapane-wheels/*.whl
      - name: Install the locked genomics provider wheel
        working-directory: providers/genomics
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/genomics-installed
        run: |
          uv sync --locked --no-install-project --python 3.15.1
          uv build --wheel --python "$UV_PROJECT_ENVIRONMENT/bin/python" --out-dir "$RUNNER_TEMP/genomics-wheels"
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps "$RUNNER_TEMP"/genomics-wheels/*.whl "$RUNNER_TEMP"/dapane-wheels/*.whl
      - name: Exercise workforce and export the pinned quotation artifact
        run: |
          PROFILE="$RUNNER_TEMP/provider-consumers-profile.jsonl"
          python3 "$GITHUB_WORKSPACE/scripts/ci_profile.py" run --name verify-workforce --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- \
            "$RUNNER_TEMP/workforce-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_provider_consumers.py" workforce \
            --provider-root "$GITHUB_WORKSPACE/providers/workforce" \
            --dapane-root "$GITHUB_WORKSPACE" \
            --cli "$GITHUB_WORKSPACE/target/release/dapane" \
            --output "$RUNNER_TEMP/provider-evidence"
      - name: Compose the installed genomics consumer and verify historical scope
        run: |
          PROFILE="$RUNNER_TEMP/provider-consumers-profile.jsonl"
          python3 "$GITHUB_WORKSPACE/scripts/ci_profile.py" run --name verify-genomics --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- \
            "$RUNNER_TEMP/genomics-installed/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_provider_consumers.py" genomics \
            --provider-root "$GITHUB_WORKSPACE/providers/genomics" \
            --dapane-root "$GITHUB_WORKSPACE" \
            --cli "$GITHUB_WORKSPACE/target/release/dapane" \
            --output "$RUNNER_TEMP/provider-evidence"
      - name: Check installed native-boundary regressions
        run: |
          PROFILE="$RUNNER_TEMP/provider-consumers-profile.jsonl"
          python3 "$GITHUB_WORKSPACE/scripts/ci_profile.py" run --name pytest-boundary --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- \
            "$RUNNER_TEMP/dapane-build/bin/python" -I -m pytest --import-mode=importlib --durations=10 --durations-min=0.05 "$GITHUB_WORKSPACE/tests/python" -q
      - name: Publish provider-consumers timing profile
        if: always()
        run: |
          python3 scripts/ci_profile.py summarize \
            --profile-file "$RUNNER_TEMP/provider-consumers-profile.jsonl" \
            --title "Installed provider consumers profile" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true
