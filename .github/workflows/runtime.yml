name: Runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_native: ${{ steps.select.outputs.run_native }}
      run_python: ${{ steps.select.outputs.run_python }}
      run_tooling: ${{ steps.select.outputs.run_tooling }}
      python_versions: ${{ steps.select.outputs.python_versions }}
      pytest_targets: ${{ steps.select.outputs.pytest_targets }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/project-python
      - name: Select affected runtime targets
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            python3 scripts/ci_select.py --mode pr \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ env.ACT }}" = "true" ]; then
            python3 scripts/ci_select.py --mode pr --base "HEAD~1" --head "HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_select.py --mode full --github-output "$GITHUB_OUTPUT"
          fi

  native:
    needs: changes
    if: needs.changes.outputs.run_native == 'true' || needs.changes.outputs.run_tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
        with:
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      - name: Cache Cargo registry and workspace build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-runtime-native-1.99.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-runtime-native-1.99.1-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting, lint and native behaviour
        run: |
          PROFILE="$RUNNER_TEMP/runtime-native-profile.jsonl"
          python3 scripts/ci_profile.py run --name cargo-fmt --profile-file "$PROFILE" -- cargo fmt --all --check
          python3 scripts/ci_profile.py run --name cargo-clippy --profile-file "$PROFILE" -- cargo clippy --workspace --locked --all-targets -- -D warnings
          python3 scripts/ci_profile.py run --name cargo-test --profile-file "$PROFILE" -- cargo test --locked
          python3 scripts/ci_profile.py run --name cargo-build-release --profile-file "$PROFILE" -- cargo build --locked --release --no-default-features -p dapane-core -p dapane-cli
      - name: Verify installed CLI
        run: |
          PROFILE="$RUNNER_TEMP/runtime-native-profile.jsonl"
          python3 scripts/ci_profile.py run --name cargo-install-cli --profile-file "$PROFILE" -- cargo install --locked --no-default-features --path crates/dapane-cli --root "$RUNNER_TEMP/dapane-installed"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dapane-installed/bin/dapane" evaluate "$GITHUB_WORKSPACE/fixtures/newborn-screening.json" > newborn-result.json
      - name: Schemas, independent reference cases and tooling checks
        run: |
          PROFILE="$RUNNER_TEMP/runtime-native-profile.jsonl"
          python3 scripts/ci_profile.py run --name pip-dev-deps --profile-file "$PROFILE" -- python -m pip install -r requirements-dev.txt
          python3 scripts/ci_profile.py run --name validate-contract --profile-file "$PROFILE" -- python scripts/validate_contract.py --cli target/release/dapane
          python3 scripts/ci_profile.py run --name validate-intervals --profile-file "$PROFILE" -- python scripts/validate_intervals.py --cli "$RUNNER_TEMP/dapane-installed/bin/dapane"
          python3 scripts/ci_profile.py run --name tooling-tests --profile-file "$PROFILE" -- python -m unittest discover -s tests/tooling -v
          python3 scripts/ci_profile.py run --name qualify-kernel --profile-file "$PROFILE" -- python scripts/qualify_kernel.py
          python3 scripts/ci_profile.py run --name validate-conductor --profile-file "$PROFILE" -- python scripts/validate_conductor.py
          python3 scripts/ci_profile.py run --name ruff-check --profile-file "$PROFILE" -- ruff check python tests/python scripts/validate_contract.py scripts/benchmark_cli.py scripts/verify_run_bundle.py scripts/validate_intervals.py scripts/qualify_kernel.py scripts/check_json_hygiene.py scripts/ci_select.py scripts/ci_profile.py scripts/run_local_ci.py tests/tooling
          python3 scripts/ci_profile.py run --name ruff-format --profile-file "$PROFILE" -- ruff format --check python tests/python scripts/validate_contract.py scripts/benchmark_cli.py scripts/verify_run_bundle.py scripts/validate_intervals.py scripts/qualify_kernel.py scripts/check_json_hygiene.py scripts/ci_select.py scripts/ci_profile.py scripts/run_local_ci.py tests/tooling
      - name: Publish native step timing profile
        if: always()
        run: |
          python3 scripts/ci_profile.py summarize \
            --profile-file "$RUNNER_TEMP/runtime-native-profile.jsonl" \
            --title "Runtime native & tooling profile" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true

  python:
    needs: changes
    if: needs.changes.outputs.run_python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.run_python == 'true' && needs.changes.outputs.python_versions || '["3.15.1"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-python
        with:
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      - name: Cache Cargo registry and wheel target artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-runtime-py${{ matrix.python }}-1.99.1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/dapane-python/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-runtime-py${{ matrix.python }}-1.99.1-
      - name: Install build tools
        run: |
          PROFILE="$RUNNER_TEMP/runtime-py-profile.jsonl"
          python3 scripts/ci_profile.py run --name rustup-minimal --profile-file "$PROFILE" -- rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          python3 scripts/ci_profile.py run --name pip-dev-deps --profile-file "$PROFILE" -- python -m pip install -r requirements-dev.txt
      - name: Build and install wheel
        run: |
          PROFILE="$RUNNER_TEMP/runtime-py-profile.jsonl"
          python3 scripts/ci_profile.py run --name maturin-build --profile-file "$PROFILE" -- maturin build --locked --release --interpreter python --out dist
          python -m pip install --no-deps dist/*.whl
      - name: Test installed package outside source tree
        run: |
          PROFILE="$RUNNER_TEMP/runtime-py-profile.jsonl"
          targets=()
          for target in ${{ needs.changes.outputs.pytest_targets || 'tests/python' }}; do
            targets+=("$GITHUB_WORKSPACE/$target")
          done
          python3 scripts/ci_profile.py run --name pytest-installed --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- python -m pytest --import-mode=importlib --durations=10 --durations-min=0.05 "${targets[@]}" -q
      - name: Replay the manual file exchange through the installed wheel and CLI
        if: startsWith(matrix.python, '3.15')
        run: |
          cargo build --locked --release -p dapane-cli
          DAPANE_CLI="$GITHUB_WORKSPACE/target/release/dapane" python -m pytest -q power_platform/test_manual_exchange.py
      - name: Publish Python step timing profile
        if: always()
        run: |
          python3 scripts/ci_profile.py summarize \
            --profile-file "$RUNNER_TEMP/runtime-py-profile.jsonl" \
            --title "Runtime Python (${{ matrix.python }}) profile" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true
