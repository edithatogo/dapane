name: Runtime

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting, lint and native behaviour
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release -p dapane-cli
      - name: Verify installed CLI
        run: |
          cargo install --locked --path crates/dapane-cli --root "$RUNNER_TEMP/dapane-installed"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dapane-installed/bin/dapane" evaluate "$GITHUB_WORKSPACE/fixtures/newborn-screening.json" > newborn-result.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15'
      - name: Schemas and independent reference cases
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/validate_contract.py --cli target/release/dapane
          python scripts/validate_conductor.py
          ruff check python tests/python scripts/validate_contract.py scripts/benchmark_cli.py
          ruff format --check python tests/python scripts/validate_contract.py scripts/benchmark_cli.py

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          python -m pip install -r requirements-dev.txt
      - name: Build and install wheel
        run: |
          maturin build --locked --release --interpreter python --out dist
          python -m pip install --no-deps dist/*.whl
      - name: Test installed package outside source tree
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests/python" -q
