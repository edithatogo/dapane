name: Process models X2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-models-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_process_models: ${{ steps.select.outputs.run_process_models }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false
      - name: Select process-models scope
        id: select
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            python3 scripts/ci_select.py --mode pr \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ env.ACT }}" = "true" ]; then
            python3 scripts/ci_select.py --mode pr --base "HEAD~1" --head "HEAD" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_select.py --mode full --github-output "$GITHUB_OUTPUT"
          fi

  process-models:
    needs: changes
    if: needs.changes.outputs.run_process_models == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ env.ACT != 'true' }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo registry and build targets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            adapters/process_models/target
          key: ${{ runner.os }}-process-models-1.99.1-${{ hashFiles('Cargo.lock', 'adapters/process_models/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-process-models-1.99.1-
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format, Clippy, Rust tests, and release binaries
        run: |
          PROFILE="$RUNNER_TEMP/process-models-profile.jsonl"
          python3 scripts/ci_profile.py run --name pm-fmt --profile-file "$PROFILE" -- cargo fmt --manifest-path adapters/process_models/Cargo.toml --all --check
          python3 scripts/ci_profile.py run --name pm-clippy --profile-file "$PROFILE" -- cargo clippy --manifest-path adapters/process_models/Cargo.toml --locked --offline --all-targets -- -D warnings
          python3 scripts/ci_profile.py run --name pm-rust-tests --profile-file "$PROFILE" -- cargo test --manifest-path adapters/process_models/Cargo.toml --locked --offline --all-targets
          python3 scripts/ci_profile.py run --name pm-build-release --profile-file "$PROFILE" -- cargo build --manifest-path adapters/process_models/Cargo.toml --locked --offline --release
          python3 scripts/ci_profile.py run --name dapane-cli-release --profile-file "$PROFILE" -- cargo build --locked --release --no-default-features -p dapane-core -p dapane-cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      - name: Build and install native wheel and verify X2 fixtures outside checkout
        run: |
          PROFILE="$RUNNER_TEMP/process-models-profile.jsonl"
          python3 scripts/ci_profile.py run --name pip-dev-deps --profile-file "$PROFILE" -- python -m pip install -r requirements-dev.txt
          python3 scripts/ci_profile.py run --name maturin-wheel --profile-file "$PROFILE" -- maturin build --locked --release --interpreter python --out "$RUNNER_TEMP/dist"
          python -m pip install --no-deps "$RUNNER_TEMP"/dist/*.whl
          DAPANE_CLI="$GITHUB_WORKSPACE/target/release/dapane" \
            DAPANE_PROCESS_MODELS_CLI="$GITHUB_WORKSPACE/adapters/process_models/target/release/dapane-process-models" \
            REQUIRE_DAPANE_WHEEL=1 \
            python3 scripts/ci_profile.py run --name pm-python-tests --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- python -m unittest discover -s "$GITHUB_WORKSPACE/adapters/process_models/tests" -p test_process_models.py -v
          python3 scripts/ci_profile.py run --name json-hygiene-tests --cwd "$RUNNER_TEMP" --profile-file "$PROFILE" -- python -m unittest discover -s "$GITHUB_WORKSPACE/tests/tooling" -p test_json_hygiene.py -v
      - name: Python lint and formatting checks
        run: |
          PROFILE="$RUNNER_TEMP/process-models-profile.jsonl"
          python3 scripts/ci_profile.py run --name ruff-check --profile-file "$PROFILE" -- ruff check adapters/process_models/tests/test_process_models.py scripts/check_json_hygiene.py tests/tooling/test_json_hygiene.py
          python3 scripts/ci_profile.py run --name ruff-format --profile-file "$PROFILE" -- ruff format --check adapters/process_models/tests/test_process_models.py scripts/check_json_hygiene.py tests/tooling/test_json_hygiene.py
      - name: Publish process-models step timing profile
        if: always()
        run: |
          python3 scripts/ci_profile.py summarize \
            --profile-file "$RUNNER_TEMP/process-models-profile.jsonl" \
            --title "Process models X2 profile" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true
