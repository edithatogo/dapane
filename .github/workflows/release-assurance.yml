name: Release assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assurance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Check the candidate policy and rejection cases
        run: |
          python scripts/release_assurance.py validate
          python -m unittest discover -s tests/release -v
          python -m pip install ruff==0.17.4
          ruff check --fix scripts/release_assurance.py tests/release
          ruff format scripts/release_assurance.py tests/release
          git diff --exit-code -- scripts/release_assurance.py tests/release
          python scripts/validate_conductor.py

  candidate:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      PYTHONHASHSEED: '0'
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          python -m pip install -r requirements-dev.txt
      - name: Build twice from clean target directories
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/dapane/source --remap-path-prefix=$RUNNER_TEMP/dapane-target-first=/dapane/target --remap-path-prefix=$RUNNER_TEMP/dapane-target-second=/dapane/target"
          for attempt in first second; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/dapane-target-$attempt"
            mkdir "$RUNNER_TEMP/dapane-$attempt"
            cargo build --locked --release --no-default-features -p dapane-cli
            install -m 755 "$CARGO_TARGET_DIR/release/dapane" "$RUNNER_TEMP/dapane-$attempt/dapane"
            maturin build --locked --release --interpreter python --out "$RUNNER_TEMP/dapane-$attempt"
          done
          mkdir "$RUNNER_TEMP/dapane-candidate"
          python scripts/release_assurance.py compare \
            --first "$RUNNER_TEMP/dapane-first" \
            --second "$RUNNER_TEMP/dapane-second" \
            --output "$RUNNER_TEMP/dapane-candidate/reproducibility.json"
          install -m 755 "$RUNNER_TEMP/dapane-first/dapane" "$RUNNER_TEMP/dapane-candidate/dapane"
          cp "$RUNNER_TEMP/dapane-first/"*.whl "$RUNNER_TEMP/dapane-candidate/"
          cargo tree --locked --no-default-features -p dapane-cli -e features > "$RUNNER_TEMP/dapane-candidate/minimal-core-features.txt"
      - name: Exercise the exact installed candidate outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/dapane-candidate"
          python -m venv "$RUNNER_TEMP/dapane-consumer"
          consumer="$RUNNER_TEMP/dapane-consumer/bin/python"
          "$consumer" -m pip install --no-deps --no-index "$artifact/"*.whl
          mkdir "$RUNNER_TEMP/dapane-consumer-cwd"
          cd "$RUNNER_TEMP/dapane-consumer-cwd"
          "$consumer" "$GITHUB_WORKSPACE/scripts/release_assurance.py" collect \
            --cli "$artifact/dapane" --wheel "$artifact/"*.whl \
            --output "$artifact/evidence.json"
          "$consumer" "$GITHUB_WORKSPACE/scripts/release_assurance.py" verify \
            --evidence "$artifact/evidence.json" --artifact-dir "$artifact"
          "$consumer" -m pip install -r "$GITHUB_WORKSPACE/requirements-dev.txt"
          "$consumer" -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests/python" \
            --junitxml="$artifact/installed-tests.xml" -q
          "$consumer" "$GITHUB_WORKSPACE/scripts/validate_contract.py" --cli "$artifact/dapane"
      - name: Record bounded throughput and memory on CPython 3.15
        if: matrix.python == '3.15'
        run: |
          "$RUNNER_TEMP/dapane-consumer/bin/python" scripts/benchmark_cli.py \
            --cli "$RUNNER_TEMP/dapane-candidate/dapane" \
            --counts 10 1000 5000 --repeats 3 \
            --output "$RUNNER_TEMP/dapane-candidate/benchmark.json"
      - name: Retain source and build identities
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/dapane-candidate"
          git archive --format=tar --prefix=dapane/ HEAD | gzip -n > "$artifact/source.tar.gz"
          git rev-parse HEAD > "$artifact/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$artifact/source-tree.txt"
          cp Cargo.lock rust-toolchain.toml requirements-dev.txt "$artifact/"
          python -m pip freeze --all > "$artifact/build-python-packages.txt"
          rustc -vV > "$artifact/rustc.txt"
          cargo --version > "$artifact/cargo.txt"
          maturin --version > "$artifact/maturin.txt"
          cd "$artifact"
          sha256sum ./* > CHECKSUMS.sha256
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-python-${{ matrix.python }}
          path: ${{ runner.temp }}/dapane-candidate/
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Install pinned assurance tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.5.10 cargo-cyclonedx
          python -m pip install -r requirements-release.txt
          mkdir "$RUNNER_TEMP/dapane-supply-chain"
      - name: Check dependency advisories, licences, duplicates and sources
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dapane-supply-chain"
          cargo metadata --locked --format-version 1 > "$evidence/cargo-metadata.json"
          cargo tree --locked --duplicates > "$evidence/duplicate-crates.txt"
          cargo deny --version > "$evidence/cargo-deny-version.txt"
          if cargo deny --locked --format json check advisories bans licenses sources > "$evidence/cargo-deny.jsonl" 2>&1; then
            export DAPANE_DENY_EXIT=0
          else
            export DAPANE_DENY_EXIT=$?
          fi
          python - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "dapane-supply-chain"
          databases = pathlib.Path(os.environ.get("CARGO_HOME", pathlib.Path.home() / ".cargo")) / "advisory-dbs"
          revisions = []
          if databases.is_dir():
              for database in sorted(databases.iterdir()):
                  result = subprocess.run(["git", "-C", str(database), "rev-parse", "HEAD"], text=True, capture_output=True)
                  if result.returncode == 0:
                      revisions.append({"database": database.name, "commit": result.stdout.strip()})
          record = {
              "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "cargo_deny_version": "0.20.2",
              "exit_code": int(os.environ["DAPANE_DENY_EXIT"]),
              "databases": revisions,
              "project_license": "unresolved; unpublished workspace crates are excluded only from licence clearance",
          }
          (root / "advisory-revisions.json").write_text(json.dumps(record, indent=2) + "\n")
          if not revisions:
              raise SystemExit("No advisory database revision could be recorded")
          PY
          cat "$evidence/cargo-deny.jsonl"
          exit "$DAPANE_DENY_EXIT"
      - name: Audit Python build and assurance dependencies
        run: |
          python -m pip_audit --strict --progress-spinner off \
            --requirement requirements-dev.txt --requirement requirements-release.txt \
            --format json --output "$RUNNER_TEMP/dapane-supply-chain/python-build-advisories.json"
      - name: Generate native dependency SBOMs without changing resolution
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          cargo cyclonedx --version > "$RUNNER_TEMP/dapane-supply-chain/cargo-cyclonedx-version.txt"
          CARGO_NET_OFFLINE=true cargo cyclonedx --format json --spec-version 1.6 \
            --target x86_64-unknown-linux-gnu --override-filename bom
          git diff --exit-code -- Cargo.lock
          for crate in dapane-core dapane-cli dapane-python; do
            cp "crates/$crate/bom.json" "$RUNNER_TEMP/dapane-supply-chain/$crate.cdx.json"
          done
          cp Cargo.lock deny.toml requirements-release.txt "$RUNNER_TEMP/dapane-supply-chain/"
          python -m pip freeze --all > "$RUNNER_TEMP/dapane-supply-chain/assurance-python-packages.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/dapane-supply-chain/source-commit.txt"
          cd "$RUNNER_TEMP/dapane-supply-chain"
          sha256sum ./* > CHECKSUMS.sha256
      - name: Retain supply-chain outcomes including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-evidence
          path: ${{ runner.temp }}/dapane-supply-chain/
          if-no-files-found: error
          retention-days: 30

  matrix:
    needs: [candidate, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/dapane-matrix
          merge-multiple: false
      - name: Require a matching receipt for every candidate interpreter
        run: |
          python scripts/release_assurance.py verify-matrix --directory "$RUNNER_TEMP/dapane-matrix"

  attest:
    needs: [matrix, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'edithatogo/dapane'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/dapane-attest
          merge-multiple: false
      - name: Attest verified main-branch candidate bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dapane-attest/**/dapane
            ${{ runner.temp }}/dapane-attest/**/*.whl
            ${{ runner.temp }}/dapane-attest/**/source.tar.gz
            ${{ runner.temp }}/dapane-attest/**/evidence.json
            ${{ runner.temp }}/dapane-attest/**/reproducibility.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain the signed provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
